---
- name: Copy entrypoint.sh file to the host
  ansible.builtin.copy:
    dest: "{{ requirements_dir }}/wordpress/tools/entrypoint.sh"
    src: entrypoint.sh

- name: Copy Dockerfile to the host
  ansible.builtin.template:
    dest: "{{ requirements_dir }}/wordpress/Dockerfile"
    src: Dockerfile.j2
