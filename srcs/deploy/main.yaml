- hosts: webserver
  become: true

  vars_files:
    - vars/vault/mariadb.yaml
    - vars/common.yaml
    - vars/mariadb.yaml
    - vars/nginx.yaml

  pre_tasks:
    - name: Wait for the remote host to be up and running
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        sleep: 1
        timeout: 300
      tags:
        - webserver

    - name: Ensure services' directories exist on the remote host
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ requirements_dir }}/mariadb/tools"
        - "{{ requirements_dir }}/mariadb/conf"
        - "{{ requirements_dir }}/wordpress/tools"
        - "{{ requirements_dir }}/nginx/conf"
      tags:
        - webserver

    - name: Update cache
      ansible.builtin.apt: update_cache=true
      tags:
        - webserver

  tasks:
    - ansible.builtin.import_role:
        name: docker
      tags:
        - docker
        - webserver

    - ansible.builtin.import_role:
        name: mariadb
      tags:
        - mariadb
        - webserver

    - ansible.builtin.import_role:
        name: wordpress
      tags:
        - wordpress
        - webserver

    - ansible.builtin.import_role:
        name: nginx
      tags:
        - nginx
        - webserver

    - ansible.builtin.import_tasks:
        file: tasks/ssl.yaml
      vars:
        # Force the regeneration of private key and certifcate file
        force_ssl_regenerate: false

    - ansible.builtin.import_tasks:
        file: tasks/docker.yaml
      vars:
        # The name of the project
        remove_volumes: true
        application_state: present
      tags:
        - docker-compose
        - webserver